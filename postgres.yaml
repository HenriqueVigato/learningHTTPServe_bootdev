services:
  db:
    image: postgres:16
    container_name: httpServerLearning
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chirpy
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chirpy"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
