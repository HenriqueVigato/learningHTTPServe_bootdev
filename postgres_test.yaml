services:
  db-test:
    image: postgres:16
    container_name: httpServerLearning-test
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: chirpy
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chirpy"]
      interval: 10s
      timeout: 5s
      retries: 5
